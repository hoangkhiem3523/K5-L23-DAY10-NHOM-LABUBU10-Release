    let curIndex = 0;
    const notesData = {};

    const canvas = document.getElementById('imgCanvas');
    const ctx = canvas.getContext('2d');
    const imgObj = new Image();

    imgObj.onload = () => {
      canvas.width = imgObj.naturalWidth;
      canvas.height = imgObj.naturalHeight;
      drawCurrent();
    };

    function loadImage(idx) {
      if (idx < 0 || idx >= items.length) return;
      curIndex = idx;
      const it = items[curIndex];
      document.getElementById('curIdxText').textContent = (curIndex + 1);
      document.getElementById('stemText').textContent = it.stem + '.jpg (' + it.index + '/250)';
      document.getElementById('boxCountText').textContent = it.boxes.length + ' Bounding Box phát hiện';
      
      // Class list pills
      const clDiv = document.getElementById('classList');
      clDiv.innerHTML = '';
      it.boxes.forEach(b => {
        const span = document.createElement('span');
        span.className = 'bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200';
        span.textContent = b.class_name;
        clDiv.appendChild(span);
      });

      // Restore saved note
      const saved = notesData[it.stem] || { verdict: '', note: '' };
      document.getElementById('noteInput').value = saved.note || '';
      updateCharCount();
      updateVerdictButtons(saved.verdict);

      imgObj.src = it.image_url;
    }

    function drawCurrent() {
      ctx.drawImage(imgObj, 0, 0);
      const showBoxes = document.getElementById('toggleBoxes').checked;
      if (!showBoxes) return;

      const it = items[curIndex];
      const W = canvas.width;
      const H = canvas.height;

      it.boxes.forEach(b => {
        const bx = (b.x - b.w / 2) * W;
        const by = (b.y - b.h / 2) * H;
        const bw = b.w * W;
        const bh = b.h * H;

        ctx.strokeStyle = '#e11d48';
        ctx.lineWidth = Math.max(2, Math.round(W / 250));
        ctx.strokeRect(bx, by, bw, bh);

        ctx.fillStyle = 'rgba(225, 29, 72, 0.85)';
        const text = b.class_name;
        ctx.font = 'bold ' + Math.max(12, Math.round(W / 35)) + 'px sans-serif';
        const tw = ctx.measureText(text).width;
        ctx.fillRect(bx, Math.max(0, by - 20), tw + 8, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, bx + 4, Math.max(15, by - 5));
      });
    }

    function setVerdict(v) {
      const it = items[curIndex];
      notesData[it.stem] = notesData[it.stem] || {};
      notesData[it.stem].verdict = v;
      updateVerdictButtons(v);
    }

    function updateVerdictButtons(v) {
      const bConf = document.getElementById('btnConfirmed');
      const bRej = document.getElementById('btnRejected');
      bConf.className = 'py-2 px-3 text-xs font-bold rounded-lg border transition flex items-center justify-center gap-1 font-mono ' + 
        (v === 'confirmed' ? 'bg-rose-700 text-white border-rose-700 shadow' : 'border-slate-300 hover:bg-slate-100 text-slate-700');
      bRej.className = 'py-2 px-3 text-xs font-bold rounded-lg border transition flex items-center justify-center gap-1 font-mono ' + 
        (v === 'rejected' ? 'bg-emerald-700 text-white border-emerald-700 shadow' : 'border-slate-300 hover:bg-slate-100 text-slate-700');
    }

    function saveCurrentNote() {
      const it = items[curIndex];
      notesData[it.stem] = notesData[it.stem] || {};
      notesData[it.stem].note = document.getElementById('noteInput').value.trim();
      alert('Đã lưu ghi chú cho ảnh ' + it.stem);
    }

    function updateCharCount() {
      const text = document.getElementById('noteInput').value.trim();
      document.getElementById('charCount').textContent = text.length;
      document.getElementById('charWarn').classList.toggle('hidden', text.length === 0 || text.length >= 20);
    }
    document.getElementById('noteInput').addEventListener('input', updateCharCount);

    function prevImage() { if (curIndex > 0) loadImage(curIndex - 1); }
    function nextImage() { if (curIndex < items.length - 1) loadImage(curIndex + 1); }

    function exportCSV() {
      let csv = 'image,type,verdict,note\n';
      items.forEach(it => {
        const d = notesData[it.stem] || {};
        if (d.verdict) {
          csv += `${it.stem},review,${d.verdict},"${(d.note || '').replace(/"/g, '""')}"\n`;
        }
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'review_batch7.csv';
      a.click();
    }

    // Init first image
    loadImage(0);
  </script>
